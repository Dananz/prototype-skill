# Quick checks only. Run the full browser suite locally with node .github/smoke.mjs.
name: quick checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quick-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        shell: bash
        run: git ls-files -z '*.mjs' | xargs -0 -r -n1 node --check
      - name: Comment image notes
        run: node .github/comment-images-unit-checks.mjs
      - name: Agent compatibility
        run: node --test .github/agent-checks.mjs
      - name: Listener lifecycle
        run: node --test .github/listener-lifecycle-checks.mjs
      - name: Share unit checks
        run: node --test .github/share-unit-checks.mjs
      - name: Self-update
        run: node --test .github/self-update-checks.mjs
      - name: Chrome profile cleanup
        run: node --test .github/chrome-sweep-checks.mjs
      - name: CLI starts
        run: node scripts/proto.mjs stack --project .

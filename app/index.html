<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Prototype</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The desk, in the page's own colors, from the first paint instead of a blank page. -->
    <style data-boot>
      html { background: #fff; }
      html.dark { background: #09090b; }
      @media (min-width: 1024px) {
        html { background: #e9e9ed; }
        html.dark { background: #0e0e11; }
      }
    </style>
    <script>
      (() => { try {
        const t = localStorage.getItem('proto-theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch {} })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
